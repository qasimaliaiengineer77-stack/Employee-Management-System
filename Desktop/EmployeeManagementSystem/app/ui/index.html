
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Management System</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Employee Management System</h1>
            <p>Manage your company employees</p>
        </header>

        <section class="stats">
            <div class="card">
                <h3>Total Employees</h3>
                <p id="totalEmployees">0</p>
            </div>
        </section>

        <section class="form-card">
            <h2 id="formTitle">Add New Employee</h2>
            <form id="employeeForm">
                <input type="hidden" id="employeeDbId">
                <input id="full_name" placeholder="Full Name" required>
                <input id="email" type="email" placeholder="Email" required>
                <input id="department" placeholder="Department" required>
                <input id="salary" type="number" min="1" placeholder="Salary" required>
                <input id="joining_date" type="date" required>
                <button type="submit" id="submitButton">Add Employee</button>
                <button type="button" id="cancelButton" hidden>Cancel Edit</button>
            </form>
        </section>

        <section class="table-card">
            <h2>Employee Records</h2>
            <input id="search" placeholder="Search employees...">
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Department</th>
                            <th>Salary</th>
                            <th>Joining Date</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="employeeTable"></tbody>
                </table>
            </div>
        </section>
        <p id="message"></p>
    </div>
    <script src="/static/script.js"></script>
</body>
</html>
